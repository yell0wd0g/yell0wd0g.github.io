console.log('############ Fetch video');
const videoEl = document.getElementById('video');

console.log('############ Get binary data');
const binaryData = atob(VIDEO_DATA_STR);
const data = new Uint8Array(binaryData.length);
for (let i = 0; i < binaryData.length; i++) {
  data[i] = binaryData.charCodeAt(i);
}

console.log('############ Get media source ready');
const mediaSource = new MediaSource();
mediaSource.addEventListener('sourceopen', async () => {
  const sourceBuffer = mediaSource.addSourceBuffer(
    'video/webm; codecs="vp9"',
  );
  sourceBuffer.mode = 'sequence';
  sourceBuffer.addEventListener('updateend', () => {
    if (!sourceBuffer.updating && mediaSource.readyState === 'open') {
      mediaSource.endOfStream();
      console.log('############ videoEl 2:',  !!videoEl);
      videoEl?.play();
    }
  });
  console.log('############ data:',  !!data);
  sourceBuffer.appendBuffer(data);
});

console.log('############ Attach src to video',  !!videoEl, !!mediaSource);
videoEl.src = URL.createObjectURL(mediaSource);
  
</script>
